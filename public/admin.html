<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Admin — Sabor & Brasas</title><style>body{margin:0;background:#090909;color:#fff;font-family:system-ui,Arial}.wrap{max-width:1100px;margin:auto;padding:20px}.login,.card{background:#151515;border:1px solid #2d2d2d;border-radius:16px;padding:18px}.login{max-width:380px;margin:80px auto}.input{width:100%;box-sizing:border-box;background:#1d1d1d;border:1px solid #444;color:#fff;border-radius:10px;padding:13px;margin:8px 0}.btn{background:#ff2929;border:0;color:#fff;padding:12px 15px;border-radius:10px;font-weight:900}.top{display:flex;justify-content:space-between;align-items:center;gap:10px}.orders{display:grid;gap:12px;margin-top:15px}.card{box-shadow:0 5px 25px #0008}.line{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap}.badge{padding:5px 9px;border-radius:999px;background:#262626;font-size:12px}.paid{background:#163b1b;color:#baffc0}.pending{background:#493e13;color:#fff0a3}.reject{background:#4b1717;color:#ffb2b2}select{background:#222;color:#fff;border:1px solid #444;padding:9px;border-radius:9px}.hidden{display:none}.muted{color:#aaa;font-size:13px}a{color:#fff}</style></head><body><div class="wrap"><div id="login" class="login"><h2>🔐 Panel privado</h2><p class="muted">Solo el dueño del negocio debe entrar aquí.</p><input class="input" id="pass" type="password" placeholder="Contraseña"><button class="btn" onclick="login()">Entrar</button><p id="err"></p></div><div id="app" class="hidden"><div class="top"><div><h1>Pedidos</h1><div class="muted">Sabor & Brasas · pedidos en tiempo real · pago únicamente en efectivo</div></div><button class="btn" onclick="logout()">Salir</button></div><div id="orders" class="orders"></div></div></div><script>
const $=x=>document.getElementById(x);async function api(url,opt={}){const r=await fetch(url,opt);const d=await r.json().catch(()=>({}));if(!r.ok)throw new Error(d.error||'Error');return d}async function boot(){try{await api('/api/admin/me');$('login').classList.add('hidden');$('app').classList.remove('hidden');load();setInterval(load,10000)}catch{}}async function login(){try{await api('/api/admin/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({password:$('pass').value})});location.reload()}catch(e){$('err').textContent=e.message}}async function logout(){await api('/api/admin/logout',{method:'POST'});location.reload()}function payment(o){return o.payment_status==='paid'?'<span class="badge paid">✅ EFECTIVO RECIBIDO</span>':'<span class="badge pending">🟡 EFECTIVO PENDIENTE</span>'}function load(){api('/api/admin/orders').then(d=>{$('orders').innerHTML=d.orders.map(o=>`<div class="card"><div class="line"><b>#${o.id}</b>${payment(o)}</div><p><b>${o.customer_name}</b> · ${o.phone}</p><p class="muted">${new Date(o.created_at).toLocaleString('es-MX')}</p><p>${o.items.map(i=>`${i.quantity}× ${i.name} — $${(i.unit/100).toFixed(2)}`).join('<br>')}</p><p><b>Total: $${o.total}</b></p><p>📍 ${o.address}${o.coordinates?`<br><span class="muted">GPS privado: ${o.coordinates}</span>`:`<br><span class="muted">GPS borrado al entregar.</span>`}</p>${o.notes?`<p>📝 ${o.notes}</p>`:''}<div class="line"><span>Estado:</span><select onchange="state('${o.id}',this.value)">${[['new','Nuevo'],['preparing','Preparando'],['ready','Listo'],['delivering','En camino'],['delivered','Entregado'],['cancelled','Cancelado']].map(([v,t])=>`<option value="${v}" ${o.fulfillment_status===v?'selected':''}>${t}</option>`).join('')}</select></div><div class="line" style="margin-top:9px"><span>Pago:</span><button class="btn" onclick="togglePaid('${o.id}',${o.payment_status==='paid'?'false':'true'})">${o.payment_status==='paid'?'Marcar efectivo pendiente':'💵 Marcar efectivo recibido'}</button></div></div>`).join('')||'<div class="card">No hay pedidos todavía.</div>'}).catch(e=>console.error(e))}async function state(id,v){await api('/api/admin/orders/'+id,{method:'PATCH',headers:{'Content-Type':'application/json'},body:JSON.stringify({fulfillmentStatus:v})});load()}async function togglePaid(id,paid){await api('/api/admin/orders/'+id+'/payment',{method:'PATCH',headers:{'Content-Type':'application/json'},body:JSON.stringify({paid})});load()}boot();
</script></body></html>
